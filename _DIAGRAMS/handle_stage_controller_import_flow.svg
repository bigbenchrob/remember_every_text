<svg xmlns="http://www.w3.org/2000/svg" width="1800" height="1320" viewBox="0 0 1800 1320" role="img" aria-labelledby="title desc">
  <title id="title">HandleStageController handle import flow</title>
  <desc id="desc">A human-readable architecture diagram showing how HandleStageController observes handle facts, derives policy, executes HandleImporter when allowed, and returns a HandleStageReport.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#f8fafc"/>
      <stop offset="55%" stop-color="#eef6f5"/>
      <stop offset="100%" stop-color="#f7f3ea"/>
    </linearGradient>
    <linearGradient id="controller" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#e7f0ff"/>
      <stop offset="100%" stop-color="#dbeafe"/>
    </linearGradient>
    <linearGradient id="provider" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#ecfdf5"/>
      <stop offset="100%" stop-color="#d1fae5"/>
    </linearGradient>
    <linearGradient id="policy" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#fff7ed"/>
      <stop offset="100%" stop-color="#fed7aa"/>
    </linearGradient>
    <linearGradient id="execution" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#f5f3ff"/>
      <stop offset="100%" stop-color="#ddd6fe"/>
    </linearGradient>
    <linearGradient id="db" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#fef2f2"/>
      <stop offset="100%" stop-color="#fecaca"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="7" stdDeviation="9" flood-color="#0f172a" flood-opacity="0.13"/>
    </filter>
    <marker id="arrow" markerWidth="14" markerHeight="14" refX="12" refY="7" orient="auto" markerUnits="strokeWidth">
      <path d="M2,2 L12,7 L2,12 Z" fill="#334155"/>
    </marker>
    <marker id="arrowSoft" markerWidth="14" markerHeight="14" refX="12" refY="7" orient="auto" markerUnits="strokeWidth">
      <path d="M2,2 L12,7 L2,12 Z" fill="#64748b"/>
    </marker>
    <style>
      .title { font: 800 34px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #0f172a; }
      .subtitle { font: 500 17px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #475569; }
      .lane-title { font: 800 16px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #334155; letter-spacing: .08em; text-transform: uppercase; }
      .node-title { font: 800 19px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #111827; }
      .node-body { font: 500 14px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #334155; }
      .node-mono { font: 600 13px "SFMono-Regular", Consolas, monospace; fill: #334155; }
      .small { font: 500 12px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #475569; }
      .pill { font: 800 12px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #334155; letter-spacing: .04em; }
      .edge { fill: none; stroke: #334155; stroke-width: 2.3; marker-end: url(#arrow); }
      .edge-soft { fill: none; stroke: #64748b; stroke-width: 1.8; marker-end: url(#arrowSoft); }
      .edge-dashed { fill: none; stroke: #64748b; stroke-width: 1.8; stroke-dasharray: 8 7; marker-end: url(#arrowSoft); }
      .box { rx: 18; filter: url(#shadow); stroke: rgba(15,23,42,.14); stroke-width: 1.2; }
      .note { fill: #ffffff; stroke: rgba(15,23,42,.12); stroke-width: 1.2; filter: url(#shadow); }
    </style>
  </defs>

  <rect width="1800" height="1320" fill="url(#bg)"/>
  <text x="72" y="76" class="title">HandleStageController: handle import flow</text>
  <text x="72" y="108" class="subtitle">Concern-local orchestration: observe handle facts → derive meaning → derive policy → maybe import → re-observe → report.</text>

  <rect x="70" y="145" width="1660" height="1060" rx="28" fill="#ffffff" opacity=".52" stroke="#cbd5e1"/>

  <text x="108" y="178" class="lane-title">Caller</text>
  <text x="350" y="178" class="lane-title">Handle stage controller</text>
  <text x="736" y="178" class="lane-title">Reactive reader / integrator graph</text>
  <text x="1120" y="178" class="lane-title">Execution</text>
  <text x="1452" y="178" class="lane-title">Databases</text>

  <!-- Caller -->
  <rect class="box" x="90" y="220" width="260" height="118" fill="#f8fafc"/>
  <text x="116" y="256" class="node-title">SyncStatePollingOrchestrator</text>
  <text x="116" y="286" class="node-body">During a polling tick:</text>
  <text x="116" y="312" class="node-mono">refreshHandles()</text>

  <rect class="box" x="90" y="392" width="260" height="110" fill="#f8fafc"/>
  <text x="116" y="428" class="node-title">Append tick events</text>
  <text x="116" y="458" class="node-body">Adds report.diagnosticEvents</text>
  <text x="116" y="482" class="node-body">to endurance log sample.</text>

  <!-- Controller column -->
  <rect class="box" x="420" y="218" width="300" height="126" fill="url(#controller)"/>
  <text x="446" y="254" class="node-title">HandleStageController</text>
  <text x="446" y="284" class="node-mono">refreshAndMaybeExecute()</text>
  <text x="446" y="312" class="node-body">Owns the handle concern only.</text>

  <rect class="box" x="420" y="390" width="300" height="126" fill="url(#controller)"/>
  <text x="446" y="426" class="node-title">Invalidate observation boundary</text>
  <text x="446" y="456" class="node-mono">liveChatDbHandleSnapshotProvider</text>
  <text x="446" y="482" class="node-mono">importLedgerHandleSnapshotProvider</text>

  <rect class="box" x="420" y="842" width="300" height="136" fill="url(#controller)"/>
  <text x="446" y="878" class="node-title">Re-observe after mutation</text>
  <text x="446" y="908" class="node-body">If import executed:</text>
  <text x="446" y="934" class="node-mono">invalidate reader providers again</text>
  <text x="446" y="960" class="node-body">then read post delta/state.</text>

  <rect class="box" x="420" y="1036" width="300" height="120" fill="url(#controller)"/>
  <text x="446" y="1072" class="node-title">HandleStageReport</text>
  <text x="446" y="1102" class="node-body">pre/post facts, state, decision,</text>
  <text x="446" y="1126" class="node-body">execution outcome, importer result,</text>
  <text x="446" y="1150" class="node-body">diagnostic events.</text>

  <!-- Reactive graph -->
  <rect class="box" x="780" y="260" width="320" height="118" fill="url(#provider)"/>
  <text x="806" y="296" class="node-title">Live handle snapshot provider</text>
  <text x="806" y="326" class="node-mono">liveChatDbHandleSnapshotProvider</text>
  <text x="806" y="352" class="node-body">Reader queries live chat.db.handle.</text>

  <rect class="box" x="780" y="430" width="320" height="118" fill="url(#provider)"/>
  <text x="806" y="466" class="node-title">Ledger handle snapshot provider</text>
  <text x="806" y="496" class="node-mono">importLedgerHandleSnapshotProvider</text>
  <text x="806" y="522" class="node-body">Reader queries shadow ledger handles.</text>

  <rect class="box" x="780" y="602" width="320" height="122" fill="url(#provider)"/>
  <text x="806" y="638" class="node-title">HandleSnapshotDelta</text>
  <text x="806" y="668" class="node-mono">handleSnapshotDeltaIntegratorProvider</text>
  <text x="806" y="694" class="node-body">Computes rowIdDelta and handleCountDelta.</text>

  <rect class="box" x="780" y="782" width="320" height="112" fill="url(#policy)"/>
  <text x="806" y="818" class="node-title">HandleSyncState</text>
  <text x="806" y="848" class="node-mono">handleSyncStateProvider</text>
  <text x="806" y="874" class="node-body">source match / source ahead / ledger ahead.</text>

  <rect class="box" x="780" y="946" width="320" height="116" fill="url(#policy)"/>
  <text x="806" y="982" class="node-title">HandleImportDecision</text>
  <text x="806" y="1012" class="node-mono">handleImportDecisionProvider</text>
  <text x="806" y="1038" class="node-body">do nothing / import / block ledger-ahead.</text>

  <!-- Execution -->
  <rect class="box" x="1172" y="688" width="300" height="126" fill="url(#execution)"/>
  <text x="1198" y="724" class="node-title">HandleImportExecutionOrchestrator</text>
  <text x="1198" y="754" class="node-mono">runForDecision(decision)</text>
  <text x="1198" y="782" class="node-body">Guards overlap and maps policy</text>
  <text x="1198" y="806" class="node-body">to execution or no-op.</text>

  <rect class="box" x="1172" y="870" width="300" height="134" fill="url(#execution)"/>
  <text x="1198" y="906" class="node-title">HandleImporter</text>
  <text x="1198" y="936" class="node-mono">importNewHandles()</text>
  <text x="1198" y="964" class="node-body">Reads ROWID &gt; ledger cursor,</text>
  <text x="1198" y="988" class="node-body">writes provenance-preserving rows.</text>

  <!-- Databases -->
  <rect class="box" x="1504" y="262" width="242" height="116" fill="url(#db)"/>
  <text x="1530" y="298" class="node-title">live chat.db</text>
  <text x="1530" y="328" class="node-mono">handle</text>
  <text x="1530" y="354" class="node-body">External source truth.</text>

  <rect class="box" x="1504" y="430" width="242" height="128" fill="url(#db)"/>
  <text x="1530" y="466" class="node-title">macos_import_shadow.db</text>
  <text x="1530" y="496" class="node-mono">handles</text>
  <text x="1530" y="522" class="node-body">Shadow import ledger.</text>
  <text x="1530" y="544" class="node-body">Only shadow writes here.</text>

  <rect class="box" x="1504" y="858" width="242" height="164" fill="url(#db)"/>
  <text x="1530" y="894" class="node-title">Inserted handle fields</text>
  <text x="1530" y="924" class="node-mono">source_id, source_kind</text>
  <text x="1530" y="948" class="node-mono">source_rowid</text>
  <text x="1530" y="972" class="node-mono">raw / normalized id</text>
  <text x="1530" y="996" class="node-mono">service, country, batch_id</text>

  <!-- Decision branch -->
  <path d="M1100 1004 C1130 1004, 1138 752, 1170 752" class="edge"/>
  <rect x="1114" y="828" width="220" height="42" rx="21" fill="#fff7ed" stroke="#fdba74"/>
  <text x="1134" y="855" class="pill">only considerIncrementalImport executes</text>

  <rect class="note" x="1168" y="1050" width="304" height="92" rx="18"/>
  <text x="1194" y="1084" class="node-title">No-op policy paths</text>
  <text x="1194" y="1114" class="node-body">doNothing → skipped</text>
  <text x="1194" y="1138" class="node-body">ledgerAheadOfSource → blocked</text>

  <!-- Edges -->
  <path d="M350 279 C382 279, 386 279, 418 279" class="edge"/>
  <path d="M570 344 L570 388" class="edge"/>
  <path d="M720 446 C750 446, 750 320, 778 320" class="edge-soft"/>
  <path d="M720 464 C750 464, 750 490, 778 490" class="edge-soft"/>
  <path d="M1100 318 C1240 318, 1350 318, 1502 318" class="edge-soft"/>
  <path d="M1100 490 C1240 490, 1350 494, 1502 494" class="edge-soft"/>
  <path d="M940 378 L940 430" class="edge"/>
  <path d="M940 548 L940 600" class="edge"/>
  <path d="M940 724 L940 780" class="edge"/>
  <path d="M940 894 L940 944" class="edge"/>
  <path d="M1472 938 C1484 938, 1490 938, 1502 938" class="edge"/>
  <path d="M1504 914 C1454 824, 1450 490, 1502 490" class="edge-dashed"/>
  <path d="M1172 938 C1124 938, 1110 914, 1100 838" class="edge-dashed"/>
  <path d="M720 910 C750 910, 750 662, 778 662" class="edge-soft"/>
  <path d="M570 978 L570 1034" class="edge"/>
  <path d="M420 1096 C370 1096, 352 450, 352 450" class="edge-soft"/>

  <!-- Step labels -->
  <circle cx="392" cy="279" r="18" fill="#0f766e"/>
  <text x="386" y="286" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-weight="800" font-size="18" fill="#fff">1</text>
  <circle cx="570" cy="366" r="18" fill="#2563eb"/>
  <text x="564" y="373" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-weight="800" font-size="18" fill="#fff">2</text>
  <circle cx="748" cy="454" r="18" fill="#2563eb"/>
  <text x="742" y="461" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-weight="800" font-size="18" fill="#fff">3</text>
  <circle cx="940" cy="575" r="18" fill="#16a34a"/>
  <text x="934" y="582" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-weight="800" font-size="18" fill="#fff">4</text>
  <circle cx="1118" cy="1004" r="18" fill="#ea580c"/>
  <text x="1112" y="1011" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-weight="800" font-size="18" fill="#fff">5</text>
  <circle cx="1490" cy="938" r="18" fill="#7c3aed"/>
  <text x="1484" y="945" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-weight="800" font-size="18" fill="#fff">6</text>
  <circle cx="570" cy="1012" r="18" fill="#2563eb"/>
  <text x="564" y="1019" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-weight="800" font-size="18" fill="#fff">7</text>

  <!-- Bottom invariant strip -->
  <rect x="110" y="1234" width="1580" height="56" rx="18" fill="#0f172a" opacity=".94"/>
  <text x="138" y="1269" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="17" font-weight="700" fill="#f8fafc">Key invariant:</text>
  <text x="252" y="1269" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="17" font-weight="500" fill="#e2e8f0">polling invalidates observation providers only; integrators derive meaning; the execution orchestrator is the only gate to HandleImporter; production databases are not mutated.</text>
</svg>
